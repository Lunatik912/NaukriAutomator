trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:

  # ============================================================
  # JAVA
  # ============================================================
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  JAVA_HOME_17_X64: 'C:\Program Files\Java\jdk-17'
  JAVA_HOME_21_X64: 'C:\Program Files\Java\jdk-21.0.12'

  # ============================================================
  # MAVEN
  # ============================================================
  MAVEN_HOME: 'C:\Program Files\Java\apache-maven-3.10.0-rc-1'

  # ============================================================
  # SONARQUBE
  # ============================================================
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'

  # ============================================================
  # AZURE
  # ============================================================
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'

  # ============================================================
  # TERRAFORM
  # ============================================================
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'

  # ============================================================
  # ELECTRON
  # ============================================================
  ELECTRON_DIR: '$(Build.SourcesDirectory)\electron'
  ELECTRON_EXE: '$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe'

  # ============================================================
  # CACHE DIRECTORIES
  # ============================================================
  CACHE_DIR: '$(Pipeline.Workspace)\naukri-cache'
  JRE_CACHE: '$(Pipeline.Workspace)\naukri-cache\jre'
  PLAYWRIGHT_CACHE: '$(Pipeline.Workspace)\naukri-cache\playwright'
  NPM_CACHE: '$(Pipeline.Workspace)\npm-cache'


# =================================================================
# ONE CONTINUOUS JOB
#
# No stage-to-stage artifact downloads.
# No repeated checkout.
# No repeated workspace creation.
# npm/JRE/Playwright caches are reused between pipeline runs.
# =================================================================

stages:

- stage: NaukriAutomatorPipeline
  displayName: 'NaukriAutomator Complete CI/CD'

  jobs:

  - job: CompletePipeline
    displayName: 'Complete NaukriAutomator CI/CD'
    timeoutInMinutes: 180

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - checkout: self
      clean: true
      displayName: '1. Checkout GitHub Repository'


    # ============================================================
    # 2. CREATE CACHE DIRECTORIES
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(CACHE_DIR)" | Out-Null

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(JRE_CACHE)" | Out-Null

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(PLAYWRIGHT_CACHE)" | Out-Null

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(NPM_CACHE)" | Out-Null

        Write-Host "Cache directories ready."

      displayName: 'Prepare Build Caches'


    # ============================================================
    # 3. RESTORE CACHE
    # ============================================================

    - task: Cache@2
      displayName: 'Restore NPM Cache'
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package-lock.json | electron/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: '$(NPM_CACHE)'


    - task: Cache@2
      displayName: 'Restore Electron Runtime Cache'
      inputs:
        key: 'electron-runtime | "$(Agent.OS)" | build/fetch-jre.ps1 | build/install-playwright.ps1'
        restoreKeys: |
          electron-runtime | "$(Agent.OS)"
        path: '$(CACHE_DIR)'


    # ============================================================
    # 4. GITLEAKS
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " GITLEAKS SECURITY SCAN"
        Write-Host "=============================================="

        gitleaks version

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks is not available."
        }

        $report = "$(Build.ArtifactStagingDirectory)\gitleaks.sarif"

        gitleaks dir "$(Build.SourcesDirectory)" `
          --redact `
          --report-format sarif `
          --report-path "$report" `
          --exit-code 0

        if (-not (Test-Path $report)) {
            throw "Gitleaks report was not generated."
        }

        Write-Host "Gitleaks scan completed."

      displayName: '4. Security Scan - Gitleaks'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.sarif'
        artifact: 'gitleaks-report'


    # ============================================================
    # 5. BACKEND TEST
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " BACKEND TEST"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 not found."
        }

        if (-not (Test-Path "$(MAVEN_HOME)\bin\mvn.cmd")) {
            throw "Maven not found."
        }

        java -version
        mvn -version

        mvn test

        if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed."
        }

        Write-Host "Backend tests completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: '5. Test Backend'


    # ============================================================
    # 6. BACKEND BUILD
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " BACKEND BUILD"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        java -version
        mvn -version

        mvn clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            throw "Backend Maven package failed."
        }

        mvn dependency:copy-dependencies `
          -DoutputDirectory=target/dependency

        if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency copy failed."
        }

        if (-not (Test-Path "target\classes")) {
            throw "Backend target\classes was not created."
        }

        Write-Host "Backend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: '6. Build Backend'


    # ============================================================
    # 7. FRONTEND BUILD
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " FRONTEND BUILD"
        Write-Host "=============================================="

        node -v
        npm -v

        npm ci --cache "$(NPM_CACHE)"

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed."
        }

        npm run build

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed."
        }

        $renderer = "$(Build.SourcesDirectory)\electron\renderer"

        if (-not (Test-Path "$renderer\index.html")) {
            throw "Frontend renderer index.html was not created."
        }

        Write-Host "Frontend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\frontend'
      displayName: '7. Build Frontend'


    # ============================================================
    # 8. SONARQUBE
    # ============================================================

    - task: SonarQubePrepare@8
      displayName: '8. Prepare SonarQube'
      inputs:
        SonarQube: 'NaukriAutomator-SC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.java.binaries=backend/target/classes
          sonar.java.libraries=backend/target/dependency/*.jar
          sonar.qualitygate.wait=true


    - task: SonarQubeAnalyze@8
      displayName: '8. Run SonarQube Scanner'
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'


    - task: SonarQubePublish@8
      displayName: '8. Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '600'


    - powershell: |

        Write-Host "SonarQube Quality Gate passed."

      displayName: '8. Quality Gate Passed'


    # ============================================================
    # 9. TERRAFORM INIT + VALIDATE
    #
    # IMPORTANT:
    # Terraform is initialized only ONCE.
    # The same .terraform directory is reused by the apply step.
    # ============================================================

    - task: AzureCLI@3
      displayName: '9. Terraform Init and Validate'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " TERRAFORM VALIDATE"
          Write-Host "=============================================="

          terraform version

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validation failed."
          }

          Write-Host "Terraform validation completed successfully."


    # ============================================================
    # 10. TERRAFORM PLAN + APPLY
    #
    # No second terraform init.
    # ============================================================

    - task: AzureCLI@3
      displayName: '10. Terraform Plan and Apply'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " TERRAFORM PLAN AND APPLY"
          Write-Host "=============================================="

          az account show

          Set-Location "$(TERRAFORM_DIR)"

          terraform plan -out=tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform plan failed."
          }

          terraform apply -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform apply failed."
          }

          Write-Host "Terraform infrastructure completed successfully."


    # ============================================================
    # 11. APPLICATION JRE
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " APPLICATION JRE"
        Write-Host "=============================================="

        $sourceJre = "$(JRE_CACHE)"
        $targetJre = "$(Build.SourcesDirectory)\electron\resources\jre"

        if (Test-Path "$sourceJre\bin\java.exe") {

            Write-Host "Cached JRE found."
            Write-Host "Copying cached JRE..."

            if (Test-Path $targetJre) {
                Remove-Item $targetJre -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $targetJre | Out-Null

            Copy-Item `
              "$sourceJre\*" `
              $targetJre `
              -Recurse `
              -Force

        }
        else {

            Write-Host "Cached JRE not found."
            Write-Host "Downloading Temurin JRE 17..."

            $env:JAVA_HOME = "$(JAVA17_HOME)"
            $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

            [Environment]::SetEnvironmentVariable(
              "JAVA_HOME",
              "$(JAVA17_HOME)",
              "Process"
            )

            [Environment]::SetEnvironmentVariable(
              "PATH",
              "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH",
              "Process"
            )

            $fetchJre = "$(Build.SourcesDirectory)\build\fetch-jre.ps1"

            if (-not (Test-Path $fetchJre)) {
                throw "fetch-jre.ps1 not found."
            }

            & $fetchJre

            if ($LASTEXITCODE -ne 0) {
                throw "JRE installation failed."
            }

            if (-not (Test-Path "$targetJre\bin\java.exe")) {
                throw "JRE was not installed correctly."
            }

            Write-Host "Saving JRE into pipeline cache..."

            if (Test-Path $sourceJre) {
                Remove-Item $sourceJre -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $sourceJre | Out-Null

            Copy-Item `
              "$targetJre\*" `
              $sourceJre `
              -Recurse `
              -Force
        }

        if (-not (Test-Path "$targetJre\bin\java.exe")) {
            throw "Application JRE is missing."
        }

        Write-Host "Application JRE ready."


    # ============================================================
    # 12. PLAYWRIGHT
    #
    # FIX:
    # Explicitly set JAVA_HOME at PROCESS LEVEL.
    #
    # This prevents:
    # "JAVA_HOME environment variable is not defined correctly"
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " PLAYWRIGHT CHROMIUM"
        Write-Host "=============================================="

        $targetPlaywright = "$(Build.SourcesDirectory)\electron\resources\playwright"
        $cachedPlaywright = "$(PLAYWRIGHT_CACHE)"

        if (Test-Path "$cachedPlaywright\chromium") {

            Write-Host "Cached Playwright Chromium found."
            Write-Host "Copying cached Playwright resources..."

            if (Test-Path $targetPlaywright) {
                Remove-Item $targetPlaywright -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $targetPlaywright | Out-Null

            Copy-Item `
              "$cachedPlaywright\*" `
              $targetPlaywright `
              -Recurse `
              -Force

        }
        else {

            Write-Host "Playwright cache not found."
            Write-Host "Installing Chromium..."

            # ----------------------------------------------------
            # FORCE JAVA 17 INTO CURRENT PROCESS
            # ----------------------------------------------------

            $javaHome = "$(JAVA17_HOME)"
            $mavenHome = "$(MAVEN_HOME)"

            if (-not (Test-Path "$javaHome\bin\java.exe")) {
                throw "Java 17 not found: $javaHome"
            }

            if (-not (Test-Path "$mavenHome\bin\mvn.cmd")) {
                throw "Maven not found: $mavenHome"
            }

            $env:JAVA_HOME = $javaHome

            $env:PATH = `
              "$javaHome\bin;" +
              "$mavenHome\bin;" +
              "$env:PATH"

            # Explicit process environment.
            [Environment]::SetEnvironmentVariable(
              "JAVA_HOME",
              $javaHome,
              [EnvironmentVariableTarget]::Process
            )

            [Environment]::SetEnvironmentVariable(
              "PATH",
              "$javaHome\bin;$mavenHome\bin;$env:PATH",
              [EnvironmentVariableTarget]::Process
            )

            Write-Host "JAVA_HOME = $env:JAVA_HOME"

            Write-Host ""
            Write-Host "Java:"
            & "$javaHome\bin\java.exe" -version

            Write-Host ""
            Write-Host "Maven:"
            & "$mavenHome\bin\mvn.cmd" -version

            # ----------------------------------------------------
            # Force PLAYWRIGHT path
            # ----------------------------------------------------

            $env:PLAYWRIGHT_BROWSERS_PATH = $targetPlaywright

            [Environment]::SetEnvironmentVariable(
              "PLAYWRIGHT_BROWSERS_PATH",
              $targetPlaywright,
              [EnvironmentVariableTarget]::Process
            )

            Write-Host ""
            Write-Host "PLAYWRIGHT_BROWSERS_PATH = $env:PLAYWRIGHT_BROWSERS_PATH"

            # ----------------------------------------------------
            # Run project script
            # ----------------------------------------------------

            $installPlaywright = `
              "$(Build.SourcesDirectory)\build\install-playwright.ps1"

            if (-not (Test-Path $installPlaywright)) {
                throw "install-playwright.ps1 not found."
            }

            Write-Host ""
            Write-Host "Running install-playwright.ps1..."

            & $installPlaywright

            if ($LASTEXITCODE -ne 0) {
                throw "Playwright installation failed."
            }

            if (-not (Test-Path $targetPlaywright)) {
                throw "Playwright resources were not created."
            }

            # ----------------------------------------------------
            # Cache Playwright
            # ----------------------------------------------------

            Write-Host ""
            Write-Host "Caching Playwright resources..."

            if (Test-Path $cachedPlaywright) {
                Remove-Item $cachedPlaywright -Recurse -Force
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $cachedPlaywright | Out-Null

            Copy-Item `
              "$targetPlaywright\*" `
              $cachedPlaywright `
              -Recurse `
              -Force
        }

        if (-not (Test-Path $targetPlaywright)) {
            throw "Playwright resources are missing."
        }

        Write-Host "Playwright Chromium ready."


    # ============================================================
    # 13. ELECTRON BUILD
    # ============================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " ELECTRON PACKAGE"
        Write-Host "=============================================="

        Set-Location "$(ELECTRON_DIR)"

        node -v
        npm -v

        # --------------------------------------------------------
        # Verify backend
        # --------------------------------------------------------

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "Backend build output is missing."
        }

        # --------------------------------------------------------
        # Verify frontend
        # --------------------------------------------------------

        if (-not (Test-Path "$(ELECTRON_DIR)\renderer\index.html")) {
            throw "Frontend renderer is missing."
        }

        # --------------------------------------------------------
        # Verify JRE
        # --------------------------------------------------------

        if (-not (Test-Path "$(ELECTRON_DIR)\resources\jre\bin\java.exe")) {
            throw "Application JRE is missing."
        }

        # --------------------------------------------------------
        # Verify Playwright
        # --------------------------------------------------------

        if (-not (Test-Path "$(ELECTRON_DIR)\resources\playwright")) {
            throw "Playwright resources are missing."
        }

        Write-Host "All required resources are ready."


        # --------------------------------------------------------
        # Electron dependencies
        # --------------------------------------------------------

        npm ci --cache "$(NPM_CACHE)"

        if ($LASTEXITCODE -ne 0) {
            throw "Electron npm ci failed."
        }


        # --------------------------------------------------------
        # Electron packaging
        # --------------------------------------------------------

        Write-Host "Running Electron Builder..."

        npm run dist

        if ($LASTEXITCODE -ne 0) {
            throw "Electron packaging failed."
        }


        # --------------------------------------------------------
        # Verify EXE
        # --------------------------------------------------------

        $distDir = "$(Build.SourcesDirectory)\dist"

        if (-not (Test-Path $distDir)) {
            throw "Electron dist directory was not created: $distDir"
        }

        Write-Host ""
        Write-Host "Generated EXE files:"

        Get-ChildItem `
          $distDir `
          -Filter "*.exe" `
          -Recurse |
          Select-Object FullName, Length


        if (-not (Test-Path "$(ELECTRON_EXE)")) {
            throw "Expected EXE was not created: $(ELECTRON_EXE)"
        }

        $fileInfo = Get-Item "$(ELECTRON_EXE)"

        Write-Host ""
        Write-Host "=============================================="
        Write-Host " ELECTRON BUILD SUCCESSFUL"
        Write-Host "=============================================="

        Write-Host "EXE: $($fileInfo.FullName)"
        Write-Host "SIZE: $($fileInfo.Length) bytes"

      displayName: '13. Build Electron'


    # ============================================================
    # 14. PUBLISH EXE
    # ============================================================

    - task: PublishPipelineArtifact@1
      displayName: '14. Publish NaukriAutomator EXE'
      inputs:
        targetPath: '$(ELECTRON_EXE)'
        artifact: 'NaukriAutomator-EXE'


    # ============================================================
    # 15. UPLOAD TO AZURE BLOB
    # ============================================================

    - task: AzureCLI@3
      displayName: '15. Upload EXE to Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " AZURE BLOB UPLOAD"
          Write-Host "=============================================="

          $source = "$(ELECTRON_EXE)"
          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          if (-not (Test-Path $source)) {
              throw "EXE not found: $source"
          }

          $fileInfo = Get-Item $source

          Write-Host "Storage Account : $(AZURE_STORAGE_ACCOUNT)"
          Write-Host "Container       : $(AZURE_STORAGE_CONTAINER)"
          Write-Host "Blob            : $blobName"
          Write-Host "Size            : $($fileInfo.Length) bytes"

          az storage blob upload `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --file "$source" `
            --auth-mode login `
            --overwrite `
            --only-show-errors

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }

          Write-Host ""
          Write-Host "Azure Blob upload completed successfully."


    # ============================================================
    # 16. DEPLOYMENT VERIFICATION
    # ============================================================

    - task: AzureCLI@3
      displayName: '16. Verify Azure Blob Deployment'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION"
          Write-Host "=============================================="

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          az storage blob show `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --auth-mode login `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION SUCCESSFUL"
          Write-Host "=============================================="

          Write-Host "Blob: $blobName"
