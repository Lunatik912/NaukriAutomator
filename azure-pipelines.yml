trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:

  # ============================================================
  # Java
  # ============================================================
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  # ============================================================
  # SonarQube
  # ============================================================
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'

  # ============================================================
  # Azure
  # ============================================================
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'

  # ============================================================
  # Terraform
  # ============================================================
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'

  # ============================================================
  # Electron
  # ============================================================
  ELECTRON_EXE: '$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe'


stages:

# ============================================================
# 1. CHECKOUT
# ============================================================
- stage: Checkout
  displayName: '1. Checkout'

  jobs:
  - job: CheckoutJob
    displayName: 'Checkout GitHub Repository'

    steps:

    - checkout: self
      clean: true


# ============================================================
# 2. GITLEAKS SECURITY SCAN
# ============================================================
- stage: SecurityScan
  displayName: '2. Security Scan - Gitleaks'
  dependsOn: Checkout

  jobs:
  - job: Gitleaks
    displayName: 'Run Gitleaks'

    steps:

    - powershell: |

        Write-Host "Checking Gitleaks..."

        gitleaks version

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks is not available."
        }

      displayName: 'Verify Gitleaks'


    - powershell: |

        Write-Host "Running Gitleaks diagnostic scan..."

        $report = "$(Build.ArtifactStagingDirectory)\gitleaks.sarif"

        gitleaks dir "$(Build.SourcesDirectory)" `
          --redact `
          --report-format sarif `
          --report-path "$report" `
          --exit-code 0

        if (-not (Test-Path $report)) {
            throw "Gitleaks SARIF report was not generated."
        }

        Write-Host "Gitleaks scan completed."

      displayName: 'Gitleaks Scan'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.sarif'
        artifact: 'gitleaks-report'


# ============================================================
# 3. TEST BACKEND
# ============================================================
- stage: TestBackend
  displayName: '3. Test Backend'
  dependsOn: SecurityScan

  jobs:
  - job: BackendTests
    displayName: 'Run Backend Tests'

    steps:

    - powershell: |

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "JAVA_HOME = $env:JAVA_HOME"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 was not found at $env:JAVA_HOME"
        }

        java -version
        mvn -version

        mvn test

        if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed with exit code $LASTEXITCODE"
        }

        Write-Host "Backend tests completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Unit Tests'


# ============================================================
# 4. BUILD BACKEND
# ============================================================
- stage: BuildBackend
  displayName: '4. Build Backend'
  dependsOn: TestBackend

  jobs:
  - job: BackendBuild
    displayName: 'Build Spring Boot Backend'

    steps:

    - powershell: |

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "JAVA_HOME = $env:JAVA_HOME"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 was not found at $env:JAVA_HOME"
        }

        java -version
        mvn -version

        mvn clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            throw "Backend Maven package failed."
        }

        mvn dependency:copy-dependencies

        if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency copy failed."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "Backend target\classes directory was not created."
        }

        Write-Host "Backend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Backend Build'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Backend Build'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\backend\target'
        artifact: 'backend-build'


# ============================================================
# 5. BUILD FRONTEND
# ============================================================
- stage: BuildFrontend
  displayName: '5. Build Frontend'
  dependsOn: BuildBackend

  jobs:
  - job: FrontendBuild
    displayName: 'Build React Frontend'

    steps:

    - powershell: |

        Write-Host "Node version:"
        node -v

        Write-Host "NPM version:"
        npm -v

        Write-Host "Installing frontend dependencies..."

        npm install

        if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
        }

        Write-Host "Building frontend..."

        npm run build

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed."
        }

        $rendererDir = "$(Build.SourcesDirectory)\electron\renderer"

        if (-not (Test-Path "$rendererDir\index.html")) {
            throw "Frontend build did not create electron\renderer\index.html."
        }

        Write-Host "Frontend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\frontend'
      displayName: 'NPM Install and Build'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend Renderer'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\electron\renderer'
        artifact: 'frontend-renderer'


# ============================================================
# 6. SONARQUBE ANALYSIS
# ============================================================
- stage: SonarQubeAnalysis
  displayName: '6. SonarQube Analysis'
  dependsOn: BuildFrontend

  jobs:
  - job: Sonar
    displayName: 'Run SonarQube Analysis'

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Backend Build'
      inputs:
        buildType: 'current'
        artifactName: 'backend-build'
        targetPath: '$(Build.SourcesDirectory)\backend\target'


    - task: SonarQubePrepare@8
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'NaukriAutomator-SC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.java.binaries=backend/target/classes
          sonar.java.libraries=backend/target/dependency/*.jar
          sonar.qualitygate.wait=true


    - task: SonarQubeAnalyze@8
      displayName: 'Run SonarQube Scanner'
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'


    - task: SonarQubePublish@8
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '600'


# ============================================================
# 7. QUALITY GATE
# ============================================================
- stage: QualityGate
  displayName: '7. Quality Gate'
  dependsOn: SonarQubeAnalysis

  jobs:
  - job: QualityGate
    displayName: 'Verify SonarQube Quality Gate'

    steps:

    - powershell: |

        Write-Host "SonarQube Quality Gate passed."

      displayName: 'Quality Gate Passed'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================
- stage: TerraformValidate
  displayName: '8. Terraform Validate'
  dependsOn: QualityGate

  jobs:
  - job: TerraformValidation
    displayName: 'Validate Terraform'

    steps:

    - task: AzureCLI@3
      displayName: 'Terraform Init and Validate'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "Terraform version:"
          terraform version

          if (-not (Test-Path "$(TERRAFORM_DIR)")) {
              throw "Terraform directory not found."
          }

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validation failed."
          }

          Write-Host "Terraform validation completed successfully."


# ============================================================
# 9. TERRAFORM INFRASTRUCTURE
# ============================================================
- stage: TerraformInfrastructure
  displayName: '9. Terraform Infrastructure'
  dependsOn: TerraformValidate

  jobs:
  - job: TerraformApply
    displayName: 'Terraform Plan and Apply'

    steps:

    - task: AzureCLI@3
      displayName: 'Terraform Plan and Apply'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "Azure account:"
          az account show

          Write-Host "Terraform version:"
          terraform version

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validation failed."
          }

          terraform plan -out=tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform plan failed."
          }

          terraform apply -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform apply failed."
          }

          Write-Host "Terraform infrastructure completed successfully."


# ============================================================
# 10. BUILD ELECTRON
#
# IMPORTANT:
# - No build.ps1
# - No backend rebuild
# - No frontend rebuild
# - No mock
#
# Backend and frontend are already built in previous stages.
# ============================================================
- stage: BuildElectron
  displayName: '10. Build Electron'
  dependsOn: TerraformInfrastructure

  jobs:
  - job: ElectronBuild
    displayName: 'Build Windows Electron Application'

    steps:

    # ----------------------------------------------------------
    # Download backend build
    # ----------------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Backend Build'
      inputs:
        buildType: 'current'
        artifactName: 'backend-build'
        targetPath: '$(Build.SourcesDirectory)\backend\target'


    # ----------------------------------------------------------
    # Download frontend renderer
    # ----------------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Frontend Renderer'
      inputs:
        buildType: 'current'
        artifactName: 'frontend-renderer'
        targetPath: '$(Build.SourcesDirectory)\electron\renderer'


    # ----------------------------------------------------------
    # Install application JRE
    # ----------------------------------------------------------
    - powershell: |

        Write-Host "Installing application JRE..."

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 was not found."
        }

        java -version

        $fetchJre = "$(Build.SourcesDirectory)\build\fetch-jre.ps1"

        if (-not (Test-Path $fetchJre)) {
            throw "fetch-jre.ps1 not found."
        }

        & $fetchJre

        if ($LASTEXITCODE -ne 0) {
            throw "JRE installation failed."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\resources\jre")) {
            throw "Application JRE was not created."
        }

        Write-Host "Application JRE installed successfully."

      displayName: 'Install Application JRE'


    # ----------------------------------------------------------
    # Install Playwright Chromium
    # ----------------------------------------------------------
    - powershell: |

        Write-Host "Installing Playwright Chromium..."

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 was not found."
        }

        java -version

        # Maven used by install-playwright.ps1
        $wrapperDir = "$(Build.SourcesDirectory)\.pipeline-tools"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $wrapperDir | Out-Null

        $realMaven = "C:\Program Files\Java\apache-maven-3.10.0-rc-1\bin\mvn.cmd"

        if (-not (Test-Path $realMaven)) {
            throw "Maven not found: $realMaven"
        }

        $mvnWrapper = Join-Path $wrapperDir "mvn.cmd"

        @(
          '@echo off'
          'set "JAVA_HOME=C:\Program Files\Java\jdk-17"'
          'set "PATH=%JAVA_HOME%\bin;%PATH%"'
          'call "C:\Program Files\Java\apache-maven-3.10.0-rc-1\bin\mvn.cmd" %*'
          'exit /b %ERRORLEVEL%'
        ) | Set-Content -Path $mvnWrapper -Encoding ASCII

        $env:PATH = "$wrapperDir;$env:PATH"

        Write-Host "Maven resolution:"
        where.exe mvn

        $installPlaywright = "$(Build.SourcesDirectory)\build\install-playwright.ps1"

        if (-not (Test-Path $installPlaywright)) {
            throw "install-playwright.ps1 not found."
        }

        & $installPlaywright

        if ($LASTEXITCODE -ne 0) {
            throw "Playwright installation failed."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\resources\playwright")) {
            throw "Playwright resources were not created."
        }

        Write-Host "Playwright Chromium installed successfully."

      displayName: 'Install Playwright Chromium'


    # ----------------------------------------------------------
    # Electron packaging
    # ----------------------------------------------------------
    - powershell: |

        Write-Host "===== Building Electron Application ====="

        Set-Location "$(Build.SourcesDirectory)\electron"

        node -v
        npm -v

        # ------------------------------------------------------
        # Verify previous build outputs
        # ------------------------------------------------------

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "Backend build output is missing."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\renderer\index.html")) {
            throw "Frontend renderer is missing."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\resources\jre")) {
            throw "Application JRE is missing."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\resources\playwright")) {
            throw "Playwright resources are missing."
        }

        # ------------------------------------------------------
        # Install Electron dependencies
        # ------------------------------------------------------

        Write-Host "Installing Electron dependencies..."

        npm install

        if ($LASTEXITCODE -ne 0) {
            throw "Electron npm install failed."
        }

        # ------------------------------------------------------
        # Package Electron
        # ------------------------------------------------------

        Write-Host "Running Electron Builder..."

        npm run dist

        if ($LASTEXITCODE -ne 0) {
            throw "Electron packaging failed."
        }

        # ------------------------------------------------------
        # Verify dist
        # ------------------------------------------------------

        $distDir = "$(Build.SourcesDirectory)\dist"

        if (-not (Test-Path $distDir)) {
            throw "Electron dist directory was not created: $distDir"
        }

        Write-Host ""
        Write-Host "Generated Electron files:"

        Get-ChildItem `
          $distDir `
          -Recurse |
          Select-Object FullName, Length

        Write-Host ""
        Write-Host "Electron packaging completed successfully."

      displayName: 'Package Electron'


    # ----------------------------------------------------------
    # IMPORTANT:
    # Stage 11 is a different job.
    # Publish dist so Stage 11 can download it.
    # ----------------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Electron Dist'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\dist'
        artifact: 'electron-dist'


# ============================================================
# 11. ARCHIVE EXE + UPLOAD AZURE BLOB
# ============================================================
- stage: PublishAndUpload
  displayName: '11. Archive EXE and Upload Azure Blob'
  dependsOn: BuildElectron

  jobs:
  - job: Publish
    displayName: 'Publish Windows EXE'

    steps:

    # ----------------------------------------------------------
    # Download Electron dist generated in Stage 10
    # ----------------------------------------------------------
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Electron Dist'
      inputs:
        buildType: 'current'
        artifactName: 'electron-dist'
        targetPath: '$(Build.SourcesDirectory)\dist'


    # ----------------------------------------------------------
    # Verify EXE
    # ----------------------------------------------------------
    - powershell: |

        Write-Host "Searching generated EXE..."

        $distDir = "$(Build.SourcesDirectory)\dist"

        if (-not (Test-Path $distDir)) {
            throw "dist directory does not exist: $distDir"
        }

        Get-ChildItem `
          $distDir `
          -Filter "*.exe" `
          -Recurse |
          Select-Object FullName, Length

        $exe = "$(ELECTRON_EXE)"

        if (-not (Test-Path $exe)) {
            throw "Expected EXE not found: $exe"
        }

        $fileInfo = Get-Item $exe

        Write-Host ""
        Write-Host "EXE found:"
        Write-Host $exe
        Write-Host "Size: $($fileInfo.Length) bytes"

      displayName: 'Verify EXE'


    # ----------------------------------------------------------
    # Publish Azure DevOps artifact
    # ----------------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: 'Publish NaukriAutomator EXE'
      inputs:
        targetPath: '$(ELECTRON_EXE)'
        artifact: 'NaukriAutomator-EXE'


    # ----------------------------------------------------------
    # Upload to Azure Blob
    # ----------------------------------------------------------
    - task: AzureCLI@3
      displayName: 'Upload EXE to Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $source = "$(ELECTRON_EXE)"
          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Uploading:"
          Write-Host "Source : $source"
          Write-Host "Blob   : $blobName"

          az storage blob upload `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --file "$source" `
            --auth-mode login `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }

          Write-Host ""
          Write-Host "Azure Blob upload completed successfully."


# ============================================================
# 12. DEPLOYMENT VERIFICATION
# ============================================================
- stage: DeploymentVerification
  displayName: '12. Deployment Verification'
  dependsOn: PublishAndUpload

  jobs:
  - job: VerifyDeployment
    displayName: 'Verify Azure Blob Deployment'

    steps:

    - task: AzureCLI@3
      displayName: 'Verify EXE in Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Checking deployed blob:"
          Write-Host $blobName

          az storage blob show `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --auth-mode login `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION SUCCESSFUL"
          Write-Host " Blob: $blobName"
          Write-Host "=============================================="
