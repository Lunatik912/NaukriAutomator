trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:

  # ============================================================
  # JAVA
  # ============================================================
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  JAVA_HOME_17_X64: 'C:\Program Files\Java\jdk-17'
  JAVA_HOME_21_X64: 'C:\Program Files\Java\jdk-21.0.12'


  # ============================================================
  # MAVEN
  # ============================================================
  MAVEN_HOME: 'C:\Program Files\Java\apache-maven-3.10.0-rc-1'


  # ============================================================
  # SONARQUBE
  # ============================================================
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'


  # ============================================================
  # AZURE
  # ============================================================
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'


  # ============================================================
  # TERRAFORM
  # ============================================================
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'


  # ============================================================
  # ELECTRON
  # ============================================================
  ELECTRON_DIR: '$(Build.SourcesDirectory)\electron'
  ELECTRON_EXE: '$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe'


  # ============================================================
  # PIPELINE CACHE
  # ============================================================
  NPM_CACHE: '$(Pipeline.Workspace)\npm-cache'
  MAVEN_CACHE: '$(Pipeline.Workspace)\m2'
  JRE_CACHE: '$(Pipeline.Workspace)\jre-cache'


# ==============================================================
# ONE CONTINUOUS JOB
#
# Everything runs on the same agent/workspace.
#
# Checkout
#   ↓
# Gitleaks
#   ↓
# Backend Test
#   ↓
# Backend Build
#   ↓
# Frontend Build
#   ↓
# SonarQube
#   ↓
# Quality Gate
#   ↓
# Terraform Validate
#   ↓
# Terraform Apply
#   ↓
# Electron
#   ↓
# Upload
#   ↓
# Verify
# ==============================================================

stages:

- stage: NaukriAutomatorPipeline
  displayName: 'NaukriAutomator Complete CI/CD'

  jobs:

  - job: CompletePipeline
    displayName: 'Complete NaukriAutomator CI/CD'

    timeoutInMinutes: 180

    steps:


    # ==========================================================
    # 1. CHECKOUT
    # ==========================================================

    - checkout: self
      clean: true
      displayName: '1. Checkout GitHub Repository'


    # ==========================================================
    # 2. GITLEAKS
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 2. GITLEAKS SECURITY SCAN"
        Write-Host "=============================================="

        gitleaks version

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks is not available."
        }

        $report = "$(Build.ArtifactStagingDirectory)\gitleaks.sarif"

        gitleaks dir "$(Build.SourcesDirectory)" `
          --redact `
          --report-format sarif `
          --report-path "$report" `
          --exit-code 0

        if (-not (Test-Path $report)) {
            throw "Gitleaks report was not generated."
        }

        Write-Host "Gitleaks scan completed."

      displayName: '2. Security Scan - Gitleaks'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.sarif'
        artifact: 'gitleaks-report'


    # ==========================================================
    # 3. BACKEND TEST
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 3. BACKEND TEST"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"

        $env:MAVEN_OPTS = "-Dmaven.repo.local=$(MAVEN_CACHE)"

        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        Write-Host "JAVA_HOME = $env:JAVA_HOME"
        Write-Host "Maven repository = $(MAVEN_CACHE)"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 was not found."
        }

        if (-not (Test-Path "$(MAVEN_HOME)\bin\mvn.cmd")) {
            throw "Maven was not found."
        }

        java -version
        mvn -version

        mvn test

        if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed."
        }

        Write-Host "Backend tests completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'

      displayName: '3. Test Backend'


    # ==========================================================
    # 4. BUILD BACKEND
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 4. BUILD BACKEND"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"

        $env:MAVEN_OPTS = "-Dmaven.repo.local=$(MAVEN_CACHE)"

        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        java -version
        mvn -version

        Write-Host "Building Spring Boot application..."

        mvn clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            throw "Backend Maven package failed."
        }

        Write-Host "Copying Maven dependencies..."

        mvn dependency:copy-dependencies

        if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency copy failed."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "backend\target\classes was not created."
        }

        Write-Host "Backend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'

      displayName: '4. Build Backend'


    # ==========================================================
    # 5. BUILD FRONTEND
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 5. BUILD FRONTEND"
        Write-Host "=============================================="

        node -v
        npm -v

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(NPM_CACHE)" | Out-Null

        Write-Host "Installing frontend dependencies..."

        npm ci --cache "$(NPM_CACHE)"

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed."
        }

        Write-Host "Building frontend..."

        npm run build

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed."
        }

        $rendererDir = "$(Build.SourcesDirectory)\electron\renderer"

        if (-not (Test-Path "$rendererDir\index.html")) {
            throw "Frontend renderer was not created."
        }

        Write-Host "Frontend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\frontend'

      displayName: '5. Build Frontend'


    # ==========================================================
    # 6. SONARQUBE
    # ==========================================================

    - task: SonarQubePrepare@8

      displayName: '6. Prepare SonarQube Analysis'

      inputs:

        SonarQube: 'NaukriAutomator-SC'

        scannerMode: 'cli'

        configMode: 'manual'

        cliProjectKey: '$(SONAR_PROJECT_KEY)'

        cliProjectName: '$(SONAR_PROJECT_NAME)'

        cliSources: '.'

        extraProperties: |

          sonar.sources=backend/src,frontend/src

          sonar.java.binaries=backend/target/classes

          sonar.java.libraries=backend/target/dependency/*.jar

          sonar.qualitygate.wait=true


    - task: SonarQubeAnalyze@8

      displayName: '6. Run SonarQube Scanner'

      inputs:
        jdkversion: 'JAVA_HOME_21_X64'


    - task: SonarQubePublish@8

      displayName: '6. Publish SonarQube Quality Gate'

      inputs:
        pollingTimeoutSec: '600'


    # ==========================================================
    # 7. QUALITY GATE
    # ==========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host " 7. QUALITY GATE"
        Write-Host "=============================================="

        Write-Host "SonarQube Quality Gate passed."

      displayName: '7. Quality Gate Passed'


    # ==========================================================
    # 8. TERRAFORM VALIDATE
    # ==========================================================

    - task: AzureCLI@3

      displayName: '8. Terraform Init and Validate'

      inputs:

        azureSubscription: 'Qwerty-Service-Connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " 8. TERRAFORM VALIDATE"
          Write-Host "=============================================="

          terraform version

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validation failed."
          }

          Write-Host "Terraform validation completed."


    # ==========================================================
    # 9. TERRAFORM PLAN + APPLY
    # ==========================================================

    - task: AzureCLI@3

      displayName: '9. Terraform Plan and Apply'

      inputs:

        azureSubscription: 'Qwerty-Service-Connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " 9. TERRAFORM INFRASTRUCTURE"
          Write-Host "=============================================="

          az account show

          terraform version

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform plan -out=tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform plan failed."
          }

          terraform apply -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform apply failed."
          }

          Write-Host "Terraform infrastructure completed."


    # ==========================================================
    # 10A. APPLICATION JRE
    #
    # IMPORTANT:
    #
    # Do NOT check $LASTEXITCODE after fetch-jre.ps1.
    #
    # The script already successfully installed the JRE.
    # We verify the actual output directory instead.
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 10. APPLICATION JRE"
        Write-Host "=============================================="

        $jrePath = "$(Build.SourcesDirectory)\electron\resources\jre"

        if (Test-Path "$jrePath\bin\java.exe") {

            Write-Host "Application JRE already exists."
            Write-Host "Skipping JRE download."

        }
        else {

            Write-Host "Application JRE not found."
            Write-Host "Downloading Temurin JRE 17..."

            $env:JAVA_HOME = "$(JAVA17_HOME)"

            $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

            java -version

            $fetchJre = "$(Build.SourcesDirectory)\build\fetch-jre.ps1"

            if (-not (Test-Path $fetchJre)) {
                throw "fetch-jre.ps1 not found."
            }

            # Run the project script.
            #
            # IMPORTANT:
            # Do NOT use $LASTEXITCODE here.
            & $fetchJre

            # Verify the real result instead.

            if (-not (Test-Path "$jrePath\bin\java.exe")) {

                Write-Host "JRE installation output:"
                
                if (Test-Path $jrePath) {
                    Get-ChildItem $jrePath -Recurse |
                        Select-Object FullName
                }

                throw "JRE was not installed correctly."

            }

            Write-Host "JRE installation completed successfully."
        }

        Write-Host ""
        Write-Host "JRE is ready:"
        Write-Host $jrePath

      displayName: '10A. Prepare Application JRE'


    # ==========================================================
    # 10B. PLAYWRIGHT
    #
    # Again, don't rely on LASTEXITCODE from the PS1 script.
    # Verify the actual browser directory.
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 10. PLAYWRIGHT CHROMIUM"
        Write-Host "=============================================="

        $playwrightPath = "$(Build.SourcesDirectory)\electron\resources\playwright"

        if (Test-Path $playwrightPath) {

            Write-Host "Playwright resources already exist."
            Write-Host "Skipping Chromium download."

        }
        else {

            Write-Host "Playwright resources not found."
            Write-Host "Installing Chromium..."

            $env:JAVA_HOME = "$(JAVA17_HOME)"

            $env:MAVEN_OPTS = "-Dmaven.repo.local=$(MAVEN_CACHE)"

            $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

            if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
                throw "Java 17 was not found."
            }

            if (-not (Test-Path "$(MAVEN_HOME)\bin\mvn.cmd")) {
                throw "Maven was not found."
            }

            java -version
            mvn -version

            $installPlaywright = "$(Build.SourcesDirectory)\build\install-playwright.ps1"

            if (-not (Test-Path $installPlaywright)) {
                throw "install-playwright.ps1 not found."
            }

            # Make Playwright browser location explicit.

            $env:PLAYWRIGHT_BROWSERS_PATH = $playwrightPath

            & $installPlaywright

            # DO NOT check LASTEXITCODE here.
            #
            # Verify the actual browser output instead.

            if (-not (Test-Path $playwrightPath)) {

                Write-Host "Playwright directory was not created."

                throw "Playwright installation failed."

            }

            Write-Host "Playwright installation completed."

        }

        Write-Host ""
        Write-Host "Playwright resources are ready:"
        Write-Host $playwrightPath

      displayName: '10B. Prepare Playwright Chromium'


    # ==========================================================
    # 10C. ELECTRON PACKAGE
    # ==========================================================

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "=============================================="
        Write-Host " 10. ELECTRON PACKAGE"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"

        $env:MAVEN_OPTS = "-Dmaven.repo.local=$(MAVEN_CACHE)"

        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        Set-Location "$(ELECTRON_DIR)"

        node -v
        npm -v

        Write-Host ""
        Write-Host "Checking backend..."

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "Backend build output is missing."
        }

        Write-Host "Backend OK."


        Write-Host ""
        Write-Host "Checking frontend..."

        if (-not (Test-Path "$(ELECTRON_DIR)\renderer\index.html")) {
            throw "Frontend renderer is missing."
        }

        Write-Host "Frontend OK."


        Write-Host ""
        Write-Host "Checking JRE..."

        if (-not (Test-Path "$(ELECTRON_DIR)\resources\jre\bin\java.exe")) {
            throw "Application JRE is missing."
        }

        Write-Host "JRE OK."


        Write-Host ""
        Write-Host "Checking Playwright..."

        if (-not (Test-Path "$(ELECTRON_DIR)\resources\playwright")) {
            throw "Playwright resources are missing."
        }

        Write-Host "Playwright OK."


        # ======================================================
        # ELECTRON NPM INSTALL
        # ======================================================

        Write-Host ""
        Write-Host "Installing Electron dependencies..."

        npm ci --cache "$(NPM_CACHE)"

        if ($LASTEXITCODE -ne 0) {
            throw "Electron npm ci failed."
        }


        # ======================================================
        # ELECTRON BUILD
        # ======================================================

        Write-Host ""
        Write-Host "Running Electron Builder..."

        npm run dist

        if ($LASTEXITCODE -ne 0) {
            throw "Electron packaging failed."
        }


        # ======================================================
        # VERIFY DIST
        # ======================================================

        $distDir = "$(Build.SourcesDirectory)\dist"

        if (-not (Test-Path $distDir)) {

            Write-Host ""
            Write-Host "Searching for generated EXE..."

            Get-ChildItem `
              "$(Build.SourcesDirectory)" `
              -Filter "*.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "Electron dist directory was not created."

        }


        Write-Host ""
        Write-Host "Generated EXE files:"

        Get-ChildItem `
          $distDir `
          -Filter "*.exe" `
          -Recurse |
          Select-Object FullName, Length


        if (-not (Test-Path "$(ELECTRON_EXE)")) {
            throw "Expected installer was not created: $(ELECTRON_EXE)"
        }


        $fileInfo = Get-Item "$(ELECTRON_EXE)"


        Write-Host ""
        Write-Host "=============================================="
        Write-Host " ELECTRON BUILD SUCCESSFUL"
        Write-Host "=============================================="

        Write-Host "EXE:"
        Write-Host $fileInfo.FullName

        Write-Host "Size:"
        Write-Host "$($fileInfo.Length) bytes"

      displayName: '10C. Package Electron'


    # ==========================================================
    # 11. PUBLISH EXE
    # ==========================================================

    - task: PublishPipelineArtifact@1

      displayName: '11. Publish NaukriAutomator EXE'

      inputs:

        targetPath: '$(ELECTRON_EXE)'

        artifact: 'NaukriAutomator-EXE'


    # ==========================================================
    # 11B. AZURE BLOB UPLOAD
    # ==========================================================

    - task: AzureCLI@3

      displayName: '11. Upload EXE to Azure Blob'

      inputs:

        azureSubscription: 'Qwerty-Service-Connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " 11. AZURE BLOB UPLOAD"
          Write-Host "=============================================="

          $source = "$(ELECTRON_EXE)"

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"


          if (-not (Test-Path $source)) {
              throw "EXE not found: $source"
          }


          $fileInfo = Get-Item $source


          Write-Host "Storage Account : $(AZURE_STORAGE_ACCOUNT)"
          Write-Host "Container       : $(AZURE_STORAGE_CONTAINER)"
          Write-Host "Source          : $source"
          Write-Host "Blob            : $blobName"
          Write-Host "File Size       : $($fileInfo.Length) bytes"


          Write-Host ""
          Write-Host "Uploading EXE..."


          az storage blob upload `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --file "$source" `
            --auth-mode login `
            --overwrite `
            --only-show-errors


          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }


          Write-Host ""
          Write-Host "Azure Blob upload completed successfully."


    # ==========================================================
    # 12. DEPLOYMENT VERIFICATION
    # ==========================================================

    - task: AzureCLI@3

      displayName: '12. Verify Azure Blob Deployment'

      inputs:

        azureSubscription: 'Qwerty-Service-Connection'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " 12. DEPLOYMENT VERIFICATION"
          Write-Host "=============================================="

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"


          Write-Host "Checking blob:"
          Write-Host $blobName


          az storage blob show `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --auth-mode login `
            --output table


          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed."
          }


          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION SUCCESSFUL"
          Write-Host "=============================================="

          Write-Host "Blob: $blobName"
