trigger:
  branches:
    include:
      - master

pool:
  name: B13-Pool

variables:
  FRONTEND_DIR: 'frontend'
  BACKEND_DIR: 'backend'
  ELECTRON_DIR: 'electron'
  MAVEN_CACHE_FOLDER: '$(Pipeline.Workspace)/.m2/repository'
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

stages:
  # =======================================================
  # 1. SECURITY SCAN & PREPARATION
  # =======================================================
  - stage: SecurityScan
    displayName: 'Security Scan (Gitleaks)'
    jobs:
      - job: GitleaksScan
        steps:
          - task: Gitleaks@2
            displayName: 'Gitleaks Detect'
            inputs:
              scanLocation: '$(Build.SourcesDirectory)'
              configType: 'default'

  # =======================================================
  # 2. PARALLEL BUILD & TEST STAGE (Runs concurrently)
  # =======================================================
  - stage: BuildAndTest
    displayName: 'Build & Test Applications'
    dependsOn: SecurityScan
    jobs:
      # --- BACKEND JOB ---
      - job: BuildBackend
        displayName: 'Build & Test Java Backend'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          # Cache Maven Dependencies for Faster Downloads
          - task: Cache@2
            displayName: 'Cache Maven packages'
            inputs:
              key: 'maven | "$(Agent.OS)" | $(BACKEND_DIR)/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          - script: mvn test
            workingDirectory: $(BACKEND_DIR)
            displayName: 'Run Backend Tests'

          - script: mvn clean package -DskipTests
            workingDirectory: $(BACKEND_DIR)
            displayName: 'Package Backend'

          - script: mvn dependency:copy-dependencies -DoutputDirectory=target/dependency
            workingDirectory: $(BACKEND_DIR)
            displayName: 'Copy Dependencies'

          # Publish Artifacts for SonarQube Scanner
          - publish: $(BACKEND_DIR)/target
            artifact: backend-target
            displayName: 'Publish Backend Target Artifact'

      # --- FRONTEND JOB ---
      - job: BuildFrontend
        displayName: 'Build React Frontend'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'

          # Cache NPM Dependencies
          - task: Cache@2
            displayName: 'Cache NPM packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | $(FRONTEND_DIR)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(HOME)/.npm

          - script: npm ci
            workingDirectory: $(FRONTEND_DIR)
            displayName: 'Install NPM Dependencies (Fast)'

          - script: npm run build
            workingDirectory: $(FRONTEND_DIR)
            displayName: 'Build React Frontend'

      # --- ELECTRON JOB ---
      - job: BuildElectron
        displayName: 'Build Electron Application'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'

          # Cache NPM Dependencies
          - task: Cache@2
            displayName: 'Cache NPM Electron packages'
            inputs:
              key: 'npm-electron | "$(Agent.OS)" | $(ELECTRON_DIR)/package-lock.json'
              restoreKeys: |
                npm-electron | "$(Agent.OS)"
              path: $(HOME)/.npm

          - script: npm ci
            workingDirectory: $(ELECTRON_DIR)
            displayName: 'Install Electron Dependencies'

          - script: npm run dist
            workingDirectory: $(ELECTRON_DIR)
            displayName: 'Build Electron Distributable'

          - task: PublishBuildArtifacts@1
            displayName: 'Archive EXE Artifact'
            inputs:
              PathtoPublish: '$(ELECTRON_DIR)/dist'
              ArtifactName: 'exe-installer'
              publishLocation: 'Container'

  # =======================================================
  # 3. SONARQUBE ANALYSIS
  # =======================================================
  - stage: CodeQuality
    displayName: 'SonarQube Analysis'
    dependsOn: BuildAndTest
    jobs:
      - job: SonarQube
        steps:
          - download: current
            artifact: backend-target

          # Prepare SonarQube analysis configuration
          - task: SonarQubePrepare@5
            inputs:
              SonarQube: 'NaukriAutomator-SC'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'NA_Jenkins_Demo'
              cliProjectName: 'NA_Jenkins_Demo'
              cliSources: 'backend/src,frontend/src'
              extraProperties: |
                sonar.java.binaries=$(Pipeline.Workspace)/backend-target/classes
                sonar.java.libraries=$(Pipeline.Workspace)/backend-target/dependency/*.jar
                sonar.scanner.skipJreProvisioning=true

          - task: SonarQubeAnalyze@5
            displayName: 'Run SonarQube Analysis'

          - task: SonarQubePublish@5
            displayName: 'Publish Quality Gate Result'
            inputs:
              pollingTimeoutSec: '600'

  # =======================================================
  # 4. TERRAFORM & DEPLOYMENT
  # =======================================================
  - stage: InfrastructureAndDeploy
    displayName: 'Terraform & Blob Storage Deployment'
    dependsOn: CodeQuality
    jobs:
      - job: TerraformAndUpload
        steps:
          - download: current
            artifact: exe-installer

          # Use Azure Key Vault or Service Connection variables for ARM credentials
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: 'latest'

          - script: |
              terraform init
              terraform validate
              terraform plan
              terraform apply -auto-approve
            workingDirectory: 'Terraform'
            displayName: 'Run Terraform Commands'
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

          # Azure CLI Task uses automated Service Connection authentication (no need for manual login steps)
          - task: AzureCLI@2
            displayName: 'Upload EXE to Azure Blob & Verify'
            inputs:
              azureSubscription: 'Qwerty-Service-Connection'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $exeFile = Get-ChildItem -Path "$(Pipeline.Workspace)/exe-installer/*.exe" | Select-Object -First 1
                $blobName = "NaukriAutomator-$(Build.BuildId).exe"

                Write-Host "Uploading $($exeFile.FullName) as $blobName..."

                az storage blob upload `
                  --account-name naterraformstorage01 `
                  --container-name nacontainer `
                  --file "$($exeFile.FullName)" `
                  --name "$blobName" `
                  --auth-mode login `
                  --overwrite

                Write-Host "===== Verifying Delivery ====="
                az storage blob show `
                  --account-name naterraformstorage01 `
                  --container-name nacontainer `
                  --name "$blobName" `
                  --auth-mode login `
                  --query "{Name:name, Size:properties.contentLength, Modified:properties.lastModified}" `
                  --output table
