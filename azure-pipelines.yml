trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:
  # Java
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  # SonarQube
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'

  # Azure
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'

  # Terraform
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'

  # Electron
  ELECTRON_EXE: '$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe'

stages:

# ============================================================
# 1. CHECKOUT
# ============================================================
- stage: Checkout
  displayName: '1. Checkout'
  jobs:
  - job: CheckoutJob
    displayName: 'Checkout GitHub Repository'
    steps:
    - checkout: self
      clean: true


# ============================================================
# 2. GITLEAKS SECURITY SCAN
# ============================================================
- stage: SecurityScan
  displayName: '2. Security Scan - Gitleaks'
  dependsOn: Checkout
  jobs:
  - job: Gitleaks
    displayName: 'Run Gitleaks'
    steps:

    - powershell: |
        Write-Host "Checking Gitleaks..."
        gitleaks version

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks is not available."
        }
      displayName: 'Verify Gitleaks'

    - powershell: |
        Write-Host "Running Gitleaks diagnostic scan..."

        gitleaks dir "$(Build.SourcesDirectory)" --redact --report-format sarif --report-path "$(Build.ArtifactStagingDirectory)\gitleaks.sarif" --exit-code 0

        Write-Host "Gitleaks diagnostic scan completed."
      displayName: 'Gitleaks Scan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Gitleaks Report'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\gitleaks.sarif'
        artifact: 'gitleaks-report'


# ============================================================
# 3. TEST BACKEND
# ============================================================
- stage: TestBackend
  displayName: '3. Test Backend'
  dependsOn: SecurityScan
  jobs:
  - job: BackendTests
    displayName: 'Run Backend Tests'
    steps:

    - powershell: |
        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "JAVA_HOME = $env:JAVA_HOME"
        java -version
        mvn -version

        mvn test
      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Unit Tests'


# ============================================================
# 4. BUILD BACKEND
# ============================================================
- stage: BuildBackend
  displayName: '4. Build Backend'
  dependsOn: TestBackend
  jobs:
  - job: BackendBuild
    displayName: 'Build Spring Boot Backend'
    steps:

    - powershell: |
        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        java -version
        mvn -version

        mvn clean package -DskipTests
        mvn dependency:copy-dependencies
      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Backend Build'


# ============================================================
# 5. BUILD FRONTEND
# ============================================================
- stage: BuildFrontend
  displayName: '5. Build Frontend'
  dependsOn: BuildBackend
  jobs:
  - job: FrontendBuild
    displayName: 'Build React Frontend'
    steps:

    - powershell: |
        node -v
        npm -v

        npm install
        npm run build
      workingDirectory: '$(Build.SourcesDirectory)\frontend'
      displayName: 'NPM Install and Build'


# ============================================================
# 6. SONARQUBE ANALYSIS
# ============================================================
- stage: SonarQubeAnalysis
  displayName: '6. SonarQube Analysis'
  dependsOn: BuildFrontend
  jobs:
  - job: Sonar
    displayName: 'Run SonarQube Analysis'
    steps:

    - task: SonarQubePrepare@8
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'NaukriAutomator-SC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.java.binaries=backend/target/classes
          sonar.java.libraries=backend/target/dependency/*.jar
          sonar.qualitygate.wait=true

    - task: SonarQubeAnalyze@8
      displayName: 'Run SonarQube Scanner'
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'

    - task: SonarQubePublish@8
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '600'


# ============================================================
# 7. QUALITY GATE
# ============================================================
- stage: QualityGate
  displayName: '7. Quality Gate'
  dependsOn: SonarQubeAnalysis
  jobs:
  - job: QualityGate
    displayName: 'Verify SonarQube Quality Gate'
    steps:

    - powershell: |
        Write-Host "SonarQube Quality Gate passed."
      displayName: 'Quality Gate Passed'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================
- stage: TerraformValidate
  displayName: '8. Terraform Validate'
  dependsOn: QualityGate
  jobs:
  - job: TerraformValidation
    displayName: 'Validate Terraform'
    steps:

    - powershell: |
        terraform version

        cd "$(TERRAFORM_DIR)"

        terraform init
        terraform validate
      displayName: 'Terraform Init and Validate'


# ============================================================
# 9. TERRAFORM INFRASTRUCTURE
# ============================================================
- stage: TerraformInfrastructure
  displayName: '9. Terraform Infrastructure'
  dependsOn: TerraformValidate
  jobs:
  - job: TerraformApply
    displayName: 'Terraform Plan and Apply'
    steps:

    - task: AzureCLI@3
      displayName: 'Terraform Plan and Apply'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "Azure account:"
          az account show

          Write-Host "Terraform version:"
          terraform version

          cd "$(TERRAFORM_DIR)"

          terraform init

          terraform validate

          terraform plan -out=tfplan

          terraform apply -auto-approve tfplan


# ============================================================
# 10. BUILD ELECTRON
# ============================================================
- stage: BuildElectron
  displayName: '10. Build Electron'
  dependsOn: TerraformInfrastructure
  jobs:
  - job: ElectronBuild
    displayName: 'Build Windows Electron Application'
    steps:

    - powershell: |
        node -v
        npm -v

        Write-Host "Installing Electron dependencies..."

        Set-Location "$(Build.SourcesDirectory)\electron"

        npm ci

        if ($LASTEXITCODE -ne 0) {
            throw "Electron dependency installation failed with exit code $LASTEXITCODE"
        }

        Write-Host "Electron dependencies installed successfully."

      displayName: 'Install Electron Dependencies'


        - powershell: |
        Write-Host "Starting NaukriAutomator Ship build..."

        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

        # ============================================================
        # Configure Java 17
        # ============================================================
        $javaHome = "C:\Program Files\Java\jdk-17"

        if (-not (Test-Path "$javaHome\bin\java.exe")) {
            throw "Java 17 not found at: $javaHome"
        }

        $env:JAVA_HOME = $javaHome
        $env:PATH = "$javaHome\bin;$env:PATH"

        Write-Host "JAVA_HOME = $env:JAVA_HOME"

        java -version
        mvn -version

        # ============================================================
        # Initialize LASTEXITCODE because build.ps1 uses
        # Set-StrictMode and accesses LASTEXITCODE.
        # ============================================================
        $global:LASTEXITCODE = 0

        # ============================================================
        # Create temporary Maven wrapper
        #
        # install-playwright.ps1 calls "mvn".
        # This wrapper guarantees JAVA_HOME is set before Maven runs.
        # ============================================================
        $wrapperDir = "$(Build.SourcesDirectory)\.pipeline-tools"

        New-Item -ItemType Directory -Force -Path $wrapperDir | Out-Null

        $realMaven = "C:\Program Files\Java\apache-maven-3.10.0-rc-1\bin\mvn.cmd"

        if (-not (Test-Path $realMaven)) {
            throw "Maven executable not found at: $realMaven"
        }

        $mvnWrapper = Join-Path $wrapperDir "mvn.cmd"

        @"
@echo off
set "JAVA_HOME=C:\Program Files\Java\jdk-17"
set "PATH=%JAVA_HOME%\bin;%PATH%"
call "$realMaven" %*
exit /b %ERRORLEVEL%
"@ | Set-Content -Path $mvnWrapper -Encoding ASCII

        # Put wrapper FIRST in PATH
        $env:PATH = "$wrapperDir;$env:PATH"

        Write-Host "Temporary Maven wrapper created:"
        Write-Host $mvnWrapper

        # Verify which Maven will be used
        where.exe mvn

        Write-Host "Starting build.ps1..."

        # ============================================================
        # Run existing project build script
        # ============================================================
        $buildScript = "$(Build.SourcesDirectory)\build\build.ps1"

        if (-not (Test-Path $buildScript)) {
            throw "Build script not found: $buildScript"
        }

        Write-Host "Build script: $buildScript"

        & $buildScript -Variant Ship

        # ============================================================
        # Final exit-code validation
        # ============================================================
        if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "NaukriAutomator Ship build failed with exit code $LASTEXITCODE"
        }

        Write-Host ""
        Write-Host "=============================================="
        Write-Host " NaukriAutomator Ship BUILD SUCCESSFUL"
        Write-Host "=============================================="

      displayName: 'Build Electron Ship Variant'

      
# ============================================================
# 11. ARCHIVE EXE + UPLOAD AZURE BLOB
# ============================================================
- stage: PublishAndUpload
  displayName: '11. Archive EXE and Upload Azure Blob'
  dependsOn: BuildElectron
  jobs:
  - job: Publish
    displayName: 'Publish Windows EXE'
    steps:

    - powershell: |

        Write-Host "Searching for generated EXE files..."

        Get-ChildItem `
          "$(Build.SourcesDirectory)\dist" `
          -Filter "*.exe" `
          -Recurse |
          Select-Object FullName, Length

      displayName: 'List Generated EXE Files'

    - powershell: |

        $exe = "$(ELECTRON_EXE)"

        if (-not (Test-Path $exe)) {
            Write-Error "Expected EXE not found: $exe"

            Write-Host "Available EXE files:"
            Get-ChildItem "$(Build.SourcesDirectory)\dist" -Filter "*.exe" -Recurse

            exit 1
        }

        Write-Host "EXE found:"
        Write-Host $exe

      displayName: 'Verify EXE'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish NaukriAutomator EXE'
      inputs:
        targetPath: '$(ELECTRON_EXE)'
        artifact: 'NaukriAutomator-EXE'

    - task: AzureCLI@3
      displayName: 'Upload EXE to Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $source = "$(ELECTRON_EXE)"
          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Uploading:"
          Write-Host "Source : $source"
          Write-Host "Blob   : $blobName"

          az storage blob upload `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --file "$source" `
            --auth-mode login `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }

          Write-Host "Azure Blob upload completed successfully."


# ============================================================
# 12. DEPLOYMENT VERIFICATION
# ============================================================
- stage: DeploymentVerification
  displayName: '12. Deployment Verification'
  dependsOn: PublishAndUpload
  jobs:
  - job: VerifyDeployment
    displayName: 'Verify Azure Blob Deployment'
    steps:

    - task: AzureCLI@3
      displayName: 'Verify EXE in Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Checking deployed blob:"
          Write-Host $blobName

          az storage blob show `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --auth-mode login `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION SUCCESSFUL"
          Write-Host " Blob: $blobName"
          Write-Host "=============================================="
