trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:

  # ============================================================
  # Java
  # ============================================================
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  # ============================================================
  # SonarQube
  # ============================================================
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'

  # ============================================================
  # Azure Storage
  # ============================================================
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'

  # ============================================================
  # Terraform
  # ============================================================
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'


stages:

# ============================================================
# 1. CHECKOUT
# ============================================================
- stage: Checkout
  displayName: '1. Checkout'
  jobs:

  - job: CheckoutJob
    displayName: 'Checkout GitHub Repository'

    steps:

    - checkout: self
      clean: true


# ============================================================
# 2. SECURITY SCAN - GITLEAKS
# ============================================================
- stage: SecurityScan
  displayName: '2. Security Scan - Gitleaks'
  dependsOn: Checkout

  jobs:

  - job: Gitleaks
    displayName: 'Run Gitleaks'

    steps:

    - powershell: |
        Write-Host "===== Scanning Repository for Secrets ====="

        gitleaks detect --source="$(Build.SourcesDirectory)" --verbose

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks scan failed."
        }

      displayName: 'Gitleaks Scan'


# ============================================================
# 3. TEST BACKEND
# ============================================================
- stage: TestBackend
  displayName: '3. Test Backend'
  dependsOn: SecurityScan

  jobs:

  - job: BackendTests
    displayName: 'Run Backend Unit Tests'

    steps:

    - powershell: |

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "===== Running Backend Unit Tests ====="

        java -version
        mvn -version

        mvn test

        if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed."
        }

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Test'


# ============================================================
# 4. BUILD BACKEND
# ============================================================
- stage: BuildBackend
  displayName: '4. Build Backend'
  dependsOn: TestBackend

  jobs:

  - job: BackendBuild
    displayName: 'Build Spring Boot Backend'

    steps:

    - powershell: |

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "===== Building Spring Boot Backend ====="

        java -version
        mvn -version

        mvn clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            throw "Backend Maven build failed."
        }

        mvn dependency:copy-dependencies -DoutputDirectory=target/dependency

        if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency copy failed."
        }

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: 'Maven Backend Build'


# ============================================================
# 5. BUILD FRONTEND
# ============================================================
- stage: BuildFrontend
  displayName: '5. Build Frontend'
  dependsOn: BuildBackend

  jobs:

  - job: FrontendBuild
    displayName: 'Build React Frontend'

    steps:

    - powershell: |

        Write-Host "===== Building React Frontend ====="

        node -v
        npm -v

        npm install

        if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
        }

        npm run build

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed."
        }

      workingDirectory: '$(Build.SourcesDirectory)\frontend'
      displayName: 'NPM Install and Build'


# ============================================================
# 6. SONARQUBE ANALYSIS
# ============================================================
- stage: SonarQubeAnalysis
  displayName: '6. SonarQube Analysis'
  dependsOn: BuildFrontend

  jobs:

  - job: Sonar
    displayName: 'Run SonarQube Analysis'

    steps:

    - task: SonarQubePrepare@8
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'NaukriAutomator-SC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.java.binaries=backend/target/classes
          sonar.java.libraries=backend/target/dependency/*.jar
          sonar.qualitygate.wait=true


    - task: SonarQubeAnalyze@8
      displayName: 'Run SonarQube Scanner'
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'


    - task: SonarQubePublish@8
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '600'


# ============================================================
# 7. QUALITY GATE
# ============================================================
- stage: QualityGate
  displayName: '7. Quality Gate'
  dependsOn: SonarQubeAnalysis

  jobs:

  - job: QualityGate
    displayName: 'Verify SonarQube Quality Gate'

    steps:

    - powershell: |

        Write-Host "===== Checking SonarQube Quality Gate ====="
        Write-Host "SonarQube Quality Gate passed."

      displayName: 'Quality Gate'


# ============================================================
# 8. TERRAFORM VALIDATE
# ============================================================
- stage: TerraformValidate
  displayName: '8. Terraform Validate'
  dependsOn: QualityGate

  jobs:

  - job: TerraformValidation
    displayName: 'Initialize and Validate Terraform'

    steps:

    - task: AzureCLI@3
      displayName: 'Terraform Init and Validate'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "===== Initializing & Validating Terraform ====="

          Set-Location "$(TERRAFORM_DIR)"

          Write-Host "===== Terraform Init ====="

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          Write-Host "===== Terraform Validate ====="

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validate failed."
          }


# ============================================================
# 9. TERRAFORM INFRASTRUCTURE
# ============================================================
- stage: TerraformInfrastructure
  displayName: '9. Terraform Infrastructure'
  dependsOn: TerraformValidate

  jobs:

  - job: TerraformApply
    displayName: 'Terraform Plan and Apply'

    steps:

    - task: AzureCLI@3
      displayName: 'Terraform Plan and Apply'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "===== Deploying Terraform Infrastructure ====="

          Set-Location "$(TERRAFORM_DIR)"

          Write-Host "===== Terraform Init ====="

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          Write-Host "===== Terraform Plan ====="

          terraform plan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform plan failed."
          }

          Write-Host "===== Terraform Apply ====="

          terraform apply -auto-approve

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform apply failed."
          }


# ============================================================
# 10. BUILD ELECTRON
# ============================================================
- stage: BuildElectron
  displayName: '10. Build Electron'
  dependsOn: TerraformInfrastructure

  jobs:

  - job: ElectronBuild
    displayName: 'Build Electron Application'

    steps:

    - powershell: |

        Write-Host "===== Building Electron Application ====="

        node -v
        npm -v

        npm install

        if ($LASTEXITCODE -ne 0) {
            throw "Electron npm install failed."
        }

        npm run dist

        if ($LASTEXITCODE -ne 0) {
            throw "Electron build failed."
        }

      workingDirectory: '$(Build.SourcesDirectory)\electron'
      displayName: 'Electron Build'


# ============================================================
# 11. ARCHIVE EXE
# ============================================================
- stage: ArchiveEXE
  displayName: '11. Archive EXE'
  dependsOn: BuildElectron

  jobs:

  - job: Archive
    displayName: 'Archive Installer'

    steps:

    - powershell: |

        Write-Host "===== Archiving Installer ====="

        if (-not (Test-Path "$(Build.SourcesDirectory)\dist")) {
            throw "dist directory was not created."
        }

        Get-ChildItem `
          "$(Build.SourcesDirectory)\dist" `
          -Filter "*.exe" |
          Select-Object Name, Length

      displayName: 'Check EXE'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish EXE Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)\dist'
        artifact: 'NaukriAutomator-EXE'


# ============================================================
# 12. UPLOAD EXE TO AZURE BLOB
# ============================================================
- stage: UploadEXE
  displayName: '12. Upload EXE to Azure Blob'
  dependsOn: ArchiveEXE

  jobs:

  - job: Upload
    displayName: 'Upload EXE to Azure Blob Storage'

    steps:

    - task: AzureCLI@3
      displayName: 'Upload EXE to Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "===== Uploading EXE to Azure Blob Storage ====="

          Set-Location "$(Build.SourcesDirectory)"

          Write-Host "===== Checking EXE ====="

          Get-ChildItem `
            "$(Build.SourcesDirectory)\dist" `
            -Filter "*.exe"

          $exe = "$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe"

          if (-not (Test-Path $exe)) {
              throw "EXE not found: $exe"
          }

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Uploading:"
          Write-Host $exe
          Write-Host "Blob name: $blobName"

          az storage blob upload `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --file "$exe" `
            --name "$blobName" `
            --auth-mode login `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }


# ============================================================
# 13. DEPLOYMENT VERIFICATION
# ============================================================
- stage: DeploymentVerification
  displayName: '13. Delivery Verification'
  dependsOn: UploadEXE

  jobs:

  - job: VerifyDeployment
    displayName: 'Verify Azure Blob Storage Artifact'

    steps:

    - task: AzureCLI@3
      displayName: 'Verify Uploaded EXE'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "===== Verifying Azure Blob Storage Artifact ====="

          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          Write-Host "Checking:"
          Write-Host $blobName

          az storage blob show `
            --account-name "$(AZURE_STORAGE_ACCOUNT)" `
            --container-name "$(AZURE_STORAGE_CONTAINER)" `
            --name "$blobName" `
            --auth-mode login `
            --query "{Name:name, Size:properties.contentLength, Modified:properties.lastModified}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed."
          }

          Write-Host ""
          Write-Host "======================================="
          Write-Host " Build Completed Successfully"
          Write-Host "======================================="
