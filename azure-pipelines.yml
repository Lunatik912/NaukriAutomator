trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: B13-Pool

variables:

  # ============================================================
  # Java
  # ============================================================
  JAVA17_HOME: 'C:\Program Files\Java\jdk-17'
  JAVA21_HOME: 'C:\Program Files\Java\jdk-21.0.12'

  # ============================================================
  # Maven
  # ============================================================
  MAVEN_HOME: 'C:\Program Files\Java\apache-maven-3.10.0-rc-1'

  # ============================================================
  # SonarQube
  # ============================================================
  SONAR_PROJECT_KEY: 'NA_Jenkins_Demo'
  SONAR_PROJECT_NAME: 'NA_Jenkins_Demo'

  # ============================================================
  # Azure
  # ============================================================
  AZURE_STORAGE_ACCOUNT: 'naterraformstorage01'
  AZURE_STORAGE_CONTAINER: 'nacontainer'

  # ============================================================
  # Terraform
  # ============================================================
  TERRAFORM_DIR: '$(Build.SourcesDirectory)\Terraform'

  # ============================================================
  # Electron
  # ============================================================
  ELECTRON_EXE: '$(Build.SourcesDirectory)\dist\NaukriAutomator 0.1.0.exe'


# ============================================================
# ONE JOB
#
# Keeping the complete pipeline in one job avoids:
# - repeated checkout
# - artifact upload/download
# - workspace recreation
# - repeated dependency downloads
# ============================================================

stages:

- stage: NaukriAutomatorPipeline
  displayName: 'NaukriAutomator CI/CD Pipeline'

  jobs:

  - job: BuildAndDeploy
    displayName: 'Build, Test, Scan, Provision and Deploy'

    steps:

    # ========================================================
    # 1. CHECKOUT
    # ========================================================

    - checkout: self
      clean: false
      fetchDepth: 1

    - powershell: |

        Write-Host "=============================================="
        Write-Host "1. CHECKOUT"
        Write-Host "=============================================="

        Write-Host "Source directory:"
        Write-Host "$(Build.SourcesDirectory)"

        git --version

        Write-Host "Repository checkout completed."

      displayName: '1. Checkout'


    # ========================================================
    # 2. GITLEAKS SECURITY SCAN
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "2. GITLEAKS SECURITY SCAN"
        Write-Host "=============================================="

        gitleaks version

        if ($LASTEXITCODE -ne 0) {
            throw "Gitleaks is not available on the agent."
        }

        $report = "$(Build.ArtifactStagingDirectory)\gitleaks.sarif"

        Write-Host "Running Gitleaks..."

        gitleaks dir "$(Build.SourcesDirectory)" `
          --redact `
          --report-format sarif `
          --report-path "$report" `
          --exit-code 0

        if (-not (Test-Path $report)) {
            throw "Gitleaks SARIF report was not generated."
        }

        Write-Host "Gitleaks scan completed."

      displayName: '2. Security Scan - Gitleaks'


    # ========================================================
    # 3. TEST BACKEND
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "3. TEST BACKEND"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 17 not found: $env:JAVA_HOME"
        }

        if (-not (Test-Path "$(MAVEN_HOME)\bin\mvn.cmd")) {
            throw "Maven not found: $(MAVEN_HOME)"
        }

        Write-Host "JAVA_HOME = $env:JAVA_HOME"

        java -version
        mvn -version

        mvn test

        if ($LASTEXITCODE -ne 0) {
            throw "Backend tests failed."
        }

        Write-Host "Backend tests completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: '3. Test Backend'


    # ========================================================
    # 4. BUILD BACKEND
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "4. BUILD BACKEND"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA17_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$(MAVEN_HOME)\bin;$env:PATH"

        mvn clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            throw "Backend Maven package failed."
        }

        mvn dependency:copy-dependencies

        if ($LASTEXITCODE -ne 0) {
            throw "Maven dependency copy failed."
        }

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "backend\target\classes was not created."
        }

        Write-Host "Backend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\backend'
      displayName: '4. Build Backend'


    # ========================================================
    # 5. BUILD FRONTEND
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "5. BUILD FRONTEND"
        Write-Host "=============================================="

        node -v
        npm -v

        Write-Host "Installing frontend dependencies..."

        npm ci --prefer-offline

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed."
        }

        Write-Host "Building frontend..."

        npm run build

        if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed."
        }

        $rendererDir = "$(Build.SourcesDirectory)\electron\renderer"

        if (-not (Test-Path "$rendererDir\index.html")) {
            throw "Frontend build did not create electron\renderer\index.html."
        }

        Write-Host "Frontend build completed successfully."

      workingDirectory: '$(Build.SourcesDirectory)\frontend'
      displayName: '5. Build Frontend'


    # ========================================================
    # 6. SONARQUBE ANALYSIS
    # ========================================================

    - task: SonarQubePrepare@8
      displayName: '6. Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'NaukriAutomator-SC'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: '$(SONAR_PROJECT_NAME)'
        cliSources: '.'
        extraProperties: |
          sonar.sources=backend/src,frontend/src
          sonar.java.binaries=backend/target/classes
          sonar.java.libraries=backend/target/dependency/*.jar
          sonar.qualitygate.wait=true


    - powershell: |

        Write-Host "=============================================="
        Write-Host "6. SONARQUBE ANALYSIS"
        Write-Host "=============================================="

        $env:JAVA_HOME = "$(JAVA21_HOME)"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        if (-not (Test-Path "$env:JAVA_HOME\bin\java.exe")) {
            throw "Java 21 not found: $env:JAVA_HOME"
        }

        Write-Host "Using Java 21 for SonarQube."

        java -version

      displayName: 'Configure Java 21 for SonarQube'


    - task: SonarQubeAnalyze@8
      displayName: 'Run SonarQube Scanner'
      inputs:
        jdkversion: 'JAVA_HOME_21_X64'


    - task: SonarQubePublish@8
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '600'


    # ========================================================
    # 7. QUALITY GATE
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "7. QUALITY GATE"
        Write-Host "=============================================="

        Write-Host "SonarQube Quality Gate passed."

      displayName: '7. Quality Gate'


    # ========================================================
    # 8. TERRAFORM VALIDATE
    # ========================================================

    - task: AzureCLI@3
      displayName: '8. Terraform Init and Validate'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=============================================="
          Write-Host "8. TERRAFORM VALIDATE"
          Write-Host "=============================================="

          terraform version

          if (-not (Test-Path "$(TERRAFORM_DIR)")) {
              throw "Terraform directory not found."
          }

          Set-Location "$(TERRAFORM_DIR)"

          terraform init

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform init failed."
          }

          terraform validate

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform validation failed."
          }

          Write-Host "Terraform validation completed successfully."


    # ========================================================
    # 9. TERRAFORM INFRASTRUCTURE
    # ========================================================

    - task: AzureCLI@3
      displayName: '9. Terraform Plan and Apply'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=============================================="
          Write-Host "9. TERRAFORM INFRASTRUCTURE"
          Write-Host "=============================================="

          az account show

          Set-Location "$(TERRAFORM_DIR)"

          terraform plan -out=tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform plan failed."
          }

          terraform apply -auto-approve tfplan

          if ($LASTEXITCODE -ne 0) {
              throw "Terraform apply failed."
          }

          Write-Host "Terraform infrastructure completed successfully."


    # ========================================================
    # 10. BUILD ELECTRON
    #
    # IMPORTANT:
    # - No build.ps1
    # - No backend rebuild
    # - No frontend rebuild
    # - No mock
    #
    # Backend + frontend are already available in this SAME JOB.
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "10. BUILD ELECTRON"
        Write-Host "=============================================="

        $javaHome = "$(JAVA17_HOME)"

        if (-not (Test-Path "$javaHome\bin\java.exe")) {
            throw "Java 17 not found: $javaHome"
        }

        $env:JAVA_HOME = $javaHome
        $env:PATH = "$javaHome\bin;$(MAVEN_HOME)\bin;$env:PATH"

        Write-Host "Java:"
        java -version

        Write-Host ""
        Write-Host "Node:"
        node -v

        Write-Host ""
        Write-Host "NPM:"
        npm -v

        Write-Host ""
        Write-Host "Maven:"
        mvn -version


        # ------------------------------------------------------
        # Verify backend
        # ------------------------------------------------------

        if (-not (Test-Path "$(Build.SourcesDirectory)\backend\target\classes")) {
            throw "Backend build output is missing."
        }

        Write-Host "Backend output verified."


        # ------------------------------------------------------
        # Verify frontend
        # ------------------------------------------------------

        if (-not (Test-Path "$(Build.SourcesDirectory)\electron\renderer\index.html")) {
            throw "Frontend renderer is missing."
        }

        Write-Host "Frontend renderer verified."


        # ------------------------------------------------------
        # Install application JRE
        # ------------------------------------------------------

        Write-Host ""
        Write-Host "Installing application JRE..."

        $fetchJre = "$(Build.SourcesDirectory)\build\fetch-jre.ps1"

        if (-not (Test-Path $fetchJre)) {
            throw "fetch-jre.ps1 not found."
        }

        & $fetchJre

        if ($LASTEXITCODE -ne 0) {
            throw "Application JRE installation failed."
        }

        $jrePath = "$(Build.SourcesDirectory)\electron\resources\jre"

        if (-not (Test-Path $jrePath)) {
            throw "Application JRE was not created."
        }

        Write-Host "Application JRE installed."


        # ------------------------------------------------------
        # Install Playwright
        # ------------------------------------------------------

        Write-Host ""
        Write-Host "Installing Playwright Chromium..."

        $playwrightPath = "$(Build.SourcesDirectory)\electron\resources\playwright"

        $installPlaywright = "$(Build.SourcesDirectory)\build\install-playwright.ps1"

        if (-not (Test-Path $installPlaywright)) {
            throw "install-playwright.ps1 not found."
        }


        # Force Maven to use Java 17.
        #
        # The project script calls "mvn", therefore put the
        # known Maven installation first in PATH.

        $env:PATH = "$(MAVEN_HOME)\bin;$env:PATH"

        Write-Host "Maven resolution:"
        where.exe mvn


        # Playwright browser location
        $env:PLAYWRIGHT_BROWSERS_PATH = $playwrightPath

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $playwrightPath | Out-Null

        & $installPlaywright

        if ($LASTEXITCODE -ne 0) {
            throw "Playwright installation failed."
        }

        if (-not (Test-Path $playwrightPath)) {
            throw "Playwright resources were not created."
        }

        Write-Host "Playwright Chromium installed."


        # ------------------------------------------------------
        # Electron dependencies
        # ------------------------------------------------------

        Set-Location "$(Build.SourcesDirectory)\electron"

        Write-Host ""
        Write-Host "Installing Electron dependencies..."

        npm ci --prefer-offline

        if ($LASTEXITCODE -ne 0) {
            throw "Electron npm ci failed."
        }


        # ------------------------------------------------------
        # Electron packaging
        # ------------------------------------------------------

        Write-Host ""
        Write-Host "Running Electron Builder..."

        npm run dist

        if ($LASTEXITCODE -ne 0) {
            throw "Electron packaging failed."
        }


        # ------------------------------------------------------
        # Verify generated EXE
        # ------------------------------------------------------

        $distDir = "$(Build.SourcesDirectory)\dist"

        if (-not (Test-Path $distDir)) {
            throw "Electron dist directory was not created."
        }

        Write-Host ""
        Write-Host "Generated EXE files:"

        Get-ChildItem `
          $distDir `
          -Filter "*.exe" `
          -Recurse |
          Select-Object FullName, Length


        $expectedExe = "$(ELECTRON_EXE)"

        if (-not (Test-Path $expectedExe)) {
            throw "Expected EXE was not created: $expectedExe"
        }

        Write-Host ""
        Write-Host "Expected EXE found:"
        Write-Host $expectedExe

        Write-Host ""
        Write-Host "ELECTRON BUILD SUCCESSFUL."

      displayName: '10. Build Electron'


    # ========================================================
    # 11. ARCHIVE EXE + UPLOAD AZURE BLOB
    # ========================================================

    - powershell: |

        Write-Host "=============================================="
        Write-Host "11. ARCHIVE EXE"
        Write-Host "=============================================="

        $exe = "$(ELECTRON_EXE)"

        if (-not (Test-Path $exe)) {
            throw "Expected EXE not found: $exe"
        }

        $fileInfo = Get-Item $exe

        Write-Host "EXE:"
        Write-Host $exe

        Write-Host "Size:"
        Write-Host "$($fileInfo.Length) bytes"

      displayName: '11. Verify EXE'


    - task: PublishPipelineArtifact@1
      displayName: 'Archive NaukriAutomator EXE'
      inputs:
        targetPath: '$(ELECTRON_EXE)'
        artifact: 'NaukriAutomator-EXE'


    - task: AzureCLI@3
      displayName: '11. Upload EXE to Azure Blob'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=============================================="
          Write-Host "11. AZURE BLOB UPLOAD"
          Write-Host "=============================================="

          $source = "$(ELECTRON_EXE)"
          $account = "$(AZURE_STORAGE_ACCOUNT)"
          $container = "$(AZURE_STORAGE_CONTAINER)"
          $blobName = "NaukriAutomator-$(Build.BuildId).exe"

          if (-not (Test-Path $source)) {
              throw "EXE not found: $source"
          }

          Write-Host "Source    : $source"
          Write-Host "Storage   : $account"
          Write-Host "Container : $container"
          Write-Host "Blob      : $blobName"


          # ----------------------------------------------------
          # Get storage account key.
          #
          # This avoids requiring:
          # Storage Blob Data Contributor
          #
          # The Azure service connection needs permission to
          # read storage account keys.
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "Getting storage account key..."

          $storageKey = az storage account keys list `
            --account-name "$account" `
            --query "[0].value" `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($storageKey)) {
              throw "Unable to retrieve storage account key."
          }

          Write-Host "Storage account key retrieved."


          # ----------------------------------------------------
          # Upload
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "Uploading EXE..."

          az storage blob upload `
            --account-name "$account" `
            --account-key "$storageKey" `
            --container-name "$container" `
            --name "$blobName" `
            --file "$source" `
            --overwrite `
            --output none

          if ($LASTEXITCODE -ne 0) {
              throw "Azure Blob upload failed."
          }

          Write-Host ""
          Write-Host "Azure Blob upload completed successfully."


    # ========================================================
    # 12. DEPLOYMENT VERIFICATION
    # ========================================================

    - task: AzureCLI@3
      displayName: '12. Deployment Verification'
      inputs:
        azureSubscription: 'Qwerty-Service-Connection'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=============================================="
          Write-Host "12. DEPLOYMENT VERIFICATION"
          Write-Host "=============================================="

          $account = "$(AZURE_STORAGE_ACCOUNT)"
          $container = "$(AZURE_STORAGE_CONTAINER)"
          $blobName = "NaukriAutomator-$(Build.BuildId).exe"


          # ----------------------------------------------------
          # Get storage account key
          # ----------------------------------------------------

          Write-Host "Getting storage account key..."

          $storageKey = az storage account keys list `
            --account-name "$account" `
            --query "[0].value" `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($storageKey)) {
              throw "Unable to retrieve storage account key."
          }


          # ----------------------------------------------------
          # Verify blob
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "Checking blob:"
          Write-Host $blobName

          $blob = az storage blob show `
            --account-name "$account" `
            --account-key "$storageKey" `
            --container-name "$container" `
            --name "$blobName" `
            --output json

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment verification failed. Blob not found."
          }

          if ([string]::IsNullOrWhiteSpace($blob)) {
              throw "Deployment verification failed. Blob information is empty."
          }

          Write-Host ""
          Write-Host "Blob found successfully."

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DEPLOYMENT VERIFICATION SUCCESSFUL"
          Write-Host "=============================================="

          Write-Host "Storage Account : $account"
          Write-Host "Container       : $container"
          Write-Host "Blob            : $blobName"
